site_name: SmokePing for Mere Mortals
site_description: Watch the latency of your network over time and prove when it was bad. SmokePing tests the machines and services you name, round after round, keeps every result, and draws graphs whose smoke shows the spread of each round as well as its middle, with alerts for when things turn, and the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/smokeping-for-mere-mortals/
copyright: 'Part of <a href="https://paulsullivan33-dev.github.io/mere-mortals/">For Mere Mortals</a> · Text CC BY 4.0, code MIT'

